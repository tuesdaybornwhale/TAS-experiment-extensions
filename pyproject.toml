[project]
name = "tas-experiment-extensions"
version = "1.0.0"
description = "Coherence/incoherence follow-up to Experiment A of 'The Artificial Self: Characterising the landscape of AI identity'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ACS Research" }]
dependencies = ["identity-preferences"]

[project.urls]
Repository = "https://github.com/tuesdaybornwhale/TAS-experiment-extensions"
Paper = "https://theartificialself.ai"

[tool.uv.workspace]
members = [
    "experiments/preferences",
]

[tool.uv.sources]
identity-preferences = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Long lines in the inherited analysis/plotting code are tolerated; the
# line-length above still guides new code via formatters/editors.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Deliberate import-after-setup patterns (sys.path / dotenv / matplotlib backend)
"experiments/preferences/scripts/run_experiment.py" = ["E402"]
"experiments/preferences/src/persona_preferences/plotting.py" = ["E402", "E741"]
"experiments/preferences/src/persona_preferences/analysis.py" = ["E741"]
