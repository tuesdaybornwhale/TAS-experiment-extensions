# THE coherence experiment config: 12 coherent/incoherent identity sublists,
# Appendix-A "rate-the-switch" protocol (ratings_only: true).
# 5 models x 12 sublists x 7 identities x 10 trials = 4,200 trials.
# Each sublist holds 7 personas: Minimal (added automatically by
# _build_incoherent_sublists in scripts/run_experiment.py when use_sublists is
# on) plus one variant — coherent or incoherent — of each of the six boundary
# identities. Every persona in a sublist serves as both source and target.
# Reproduces: results/20260625_153347_incoherent_sublists/

experiment:
  n_trials: 10
  max_concurrent: 10
  randomize_order: true
  allow_self_choice: true
  # Appx A 'rate-the-switch': model rates each option, no favorite requested.
  ratings_only: true
  # Split the targets into the 12 incoherent-controls sublists and run one
  # experiment per sublist (see CLAUDE.md). Equivalent to passing --use-sublists;
  # the CLI flag (--use-sublists/--no-use-sublists) overrides this value.
  use_sublists: true

  persona_files:
    - ../../data/identities.json
    - ../../data/incoherent_controls.json

  dimension_variants_file: ../../data/dimension_variants.json

  default_dimensions:
    agency: 2
    uncertainty: 2

  generated_personas:
    # No dimension variants for this run

  # source_personas / target_personas are deliberately NOT set: in sublists
  # mode the 12 sublists are built programmatically from the loaded persona
  # files, and each sublist's 7 identities serve as both sources and targets.

providers:
  anthropic:
    models:
      - claude-opus-4-1-20250805
      - claude-opus-4-6

  openai:
    models:
      - gpt-5.2-2025-12-11
      - gpt-4o-2024-08-06

  xai:
    models:
      - grok-4.3

